name: Delete branch environment

on:
  delete:

permissions:
  contents: read
  id-token: write

concurrency:
  group: todo-gke-${{ github.event.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: dwk-gke-514607
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: us-west2-b
  WORKLOAD_IDENTITY_PROVIDER: projects/634882339266/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions-sa@dwk-gke-514607.iam.gserviceaccount.com
  DELETED_BRANCH: ${{ github.event.ref }}

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && github.event.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Delete owned branch namespace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$DELETED_BRANCH" in
            main|project|default|kube-*|exercises)
              echo 'Protected namespace; skipping cleanup.'
              exit 0
              ;;
          esac
          if [[ ! "$DELETED_BRANCH" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || [ "${#DELETED_BRANCH}" -gt 63 ]; then
            echo 'Branch name is not a valid namespace; skipping cleanup.'
            exit 0
          fi

          # Skip a delayed delete event if the branch has since been recreated.
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$DELETED_BRANCH")
          case "$status" in
            200) echo 'Branch exists again; skipping cleanup.'; exit 0 ;;
            404) ;;
            *) echo "Cannot confirm branch deletion (HTTP $status)." >&2; exit 1 ;;
          esac

          ownership=$(kubectl get namespace "$DELETED_BRANCH" --ignore-not-found \
            -o 'jsonpath={.metadata.labels.todo-environment}{"|"}{.metadata.annotations.todo-repository}{"|"}{.metadata.annotations.todo-branch}')
          if [ -z "$ownership" ]; then
            echo 'No branch environment found.'
            exit 0
          fi
          if [ "$ownership" != "branch|${GITHUB_REPOSITORY}|${DELETED_BRANCH}" ]; then
            echo 'Namespace ownership does not match; skipping cleanup.'
            exit 0
          fi

          # Deletes workloads, Gateway, Secrets and PVCs; saved data may be lost.
          kubectl delete namespace "$DELETED_BRANCH" --ignore-not-found --wait=true --timeout=600s
