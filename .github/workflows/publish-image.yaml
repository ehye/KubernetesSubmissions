name: Build and publish image
run-name: Publish ${{ inputs.image }}:${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      image:
        description: Application image to build
        required: true
        type: choice
        default: ping-pong
        options:
          - ping-pong
          - log-output
          - todo-app
          - todo-backend
      tag:
        description: Docker image tag (for example, 3.1)
        required: true
        type: string
        default: "3.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out selected source branch
        uses: actions/checkout@v7.0.1

      - name: Validate inputs and select build directory
        id: image
        shell: bash
        env:
          APPLICATION: ${{ inputs.image }}
          IMAGE_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$APPLICATION" in
            ping-pong) directory=ping_pong ;;
            log-output) directory=log_output ;;
            todo-app) directory=todo_app ;;
            todo-backend) directory=todo_backend ;;
            *) echo "Unsupported application image" >&2; exit 1 ;;
          esac
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: use 1-128 letters, digits, underscores, dots or hyphens; do not start with a dot or hyphen" >&2
            exit 1
          fi
          printf 'context=./%s\n' "$directory" >> "$GITHUB_OUTPUT"
          printf 'reference=ghcr.io/%s/%s:%s\n' "${OWNER,,}" "$APPLICATION" "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish selected image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ steps.image.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Show published image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          printf '### Published image\n\n`%s`\n' "$IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
