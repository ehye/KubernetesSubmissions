name: Publish Todo environment

on:
  push:
    branches: [main]
    tags: ['**']
    paths:
      - 'todo_app/**'
      - 'todo_backend/**'
      - 'broadcaster/**'
      - '.github/workflows/todo-environments.yaml'
      - '.github/scripts/promote-todo.sh'

jobs:
  scope:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ github.ref_type == 'branch' || steps.tag.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag'
        with:
          fetch-depth: 0
          persist-credentials: false
      # GitHub applies push.paths to branches, but not to tags.
      - id: tag
        if: github.ref_type == 'tag'
        name: Check tagged commit for Todo changes
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse --verify --quiet HEAD^1 || git hash-object -t tree /dev/null)
          if git diff --quiet "$base" HEAD -- todo_app/ todo_backend/ broadcaster/ \
            .github/workflows/todo-environments.yaml .github/scripts/promote-todo.sh; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ $status == 1 ]] || exit "$status"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: scope
    if: needs.scope.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: env.TARGET == 'staging'
      - uses: docker/login-action@v3
        if: env.TARGET == 'staging'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build staging images from the triggering commit
        if: env.TARGET == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          commit=$(git rev-parse HEAD)
          records="$RUNNER_TEMP/todo-images.jsonl"
          : > "$records"
          for image in todo-app todo-backend broadcaster; do
            name="ghcr.io/$owner/$image"
            docker buildx build --platform linux/amd64 --push \
              --tag "$name:$commit" --metadata-file "$RUNNER_TEMP/image.json" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "${image//-/_}"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/image.json")
            jq -n --arg name "$image" --arg repo "$name" --arg digest "$digest" \
              '{name:$name,newName:$repo,digest:$digest}' >> "$records"
          done
          jq -s 'sort_by(.name)' "$records" > "$RUNNER_TEMP/todo-images.json"
      - name: Mint a GitOps-only installation token
        id: gitops-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ehye
          repositories: KubernetesSubmissions-gitops
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: ehye/KubernetesSubmissions-gitops
          ref: main
          path: gitops
          token: ${{ steps.gitops-token.outputs.token }}
      - name: Promote image digests on GitOps main
        run: bash .github/scripts/promote-todo.sh "$TARGET" "$(git rev-parse HEAD)" "$RUNNER_TEMP/todo-images.json"
