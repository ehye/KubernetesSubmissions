name: Publish Todo environment

on:
  push:
    branches: [main]
    tags: ['**']

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      TARGET: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images from the triggering commit and render the environment
        shell: bash
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          commit=$(git rev-parse HEAD)
          refs=()
          for image in todo-app todo-backend broadcaster; do
            name="ghcr.io/$owner/$image"
            docker buildx build --platform linux/amd64 --push \
              --tag "$name:$commit" --metadata-file "$RUNNER_TEMP/image.json" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "${image//-/_}"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/image.json")
            refs+=("$name@$digest")
          done
          bash .github/scripts/render-todo.sh "$TARGET" "${refs[@]}" > "$RUNNER_TEMP/todo.yaml"
      - name: Publish desired state for Argo CD
        run: bash .github/scripts/promote-todo.sh "$TARGET" "$RUNNER_TEMP/todo.yaml"
