apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: local-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo-local
  namespace: project
spec:
  gatewayClassName: local-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-local
  namespace: project
spec:
  parentRefs:
    - name: todo-local
  rules:
    - backendRefs:
        - name: todo-app-svc
          port: 2345
