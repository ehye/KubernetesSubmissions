apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: local-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo-local
  namespace: project
spec:
  gatewayClassName: local-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-local
  namespace: project
spec:
  parentRefs:
    - name: todo-local
  rules:
    - backendRefs:
        - name: todo-app-svc
          port: 2345
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: exercises-local
  namespace: exercises
spec:
  gatewayClassName: local-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exercises-local
  namespace: exercises
spec:
  parentRefs:
    - name: exercises-local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ping-pong-svc
          port: 2345
    - backendRefs:
        - name: log-output-svc
          port: 2345
