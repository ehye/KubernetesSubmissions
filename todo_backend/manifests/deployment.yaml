apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:2.10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: SHUTDOWN_TIMEOUT_MS
              value: "10000"
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: todo-postgres-svc
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT_MS
              value: "1000"
            - name: PGSTATEMENT_TIMEOUT_MS
              value: "1000"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: todo-postgres-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: todo-postgres-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 3000
