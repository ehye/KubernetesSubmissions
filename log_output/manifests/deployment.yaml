apiVersion: apps/v1
kind: Deployment
metadata:
  name: randomstring-dep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: randomstring
  template:
    metadata:
      labels:
        app: randomstring
    spec:
      containers:
        - name: writer
          image: log-output:2.1
          command: ["node", "dist/writer.js"]
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: LOG_FILE
              value: /shared/log.txt
          volumeMounts:
            - name: log-data
              mountPath: /shared
        - name: reader
          image: log-output:2.1
          command: ["node", "dist/index.js"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          env:
            - name: PORT
              value: "3000"
            - name: LOG_FILE
              value: /shared/log.txt
            - name: PING_PONG_URL
              value: http://ping-pong-svc:2345/pings
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: log-data
              mountPath: /shared
              readOnly: true
      volumes:
        - name: log-data
          emptyDir: {}
