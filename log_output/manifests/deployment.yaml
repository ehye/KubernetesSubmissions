apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: writer
          image: log-output:2.5
          command: ["node", "dist/writer.js"]
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: LOG_FILE
              value: /shared/log.txt
          volumeMounts:
            - name: log-data
              mountPath: /shared
        - name: reader
          image: log-output:2.5
          command: ["node", "dist/index.js"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-configmap
                  key: MESSAGE
            - name: PORT
              value: "3000"
            - name: INFORMATION_FILE
              value: /etc/config/information.txt
            - name: LOG_FILE
              value: /shared/log.txt
            - name: PING_PONG_URL
              value: http://ping-pong-svc:2345/pings
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: log-data
              mountPath: /shared
              readOnly: true
            - name: config-data
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: log-data
          emptyDir: {}
        - name: config-data
          configMap:
            name: log-output-configmap
            items:
              - key: information.txt
                path: information.txt
