apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k3d
  - ../../../broadcaster
  - frontend-pvc.yaml
patches:
  - target:
      kind: Deployment
      name: todo-backend-dep|broadcaster
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NATS_SUBJECT
          value: todos.$(POD_NAMESPACE).status
