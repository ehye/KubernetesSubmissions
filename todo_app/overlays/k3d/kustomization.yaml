apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project
resources:
  - ../../manifests
  - ../../../todo_backend/manifests
  - restart-rate.yaml
  - gateway.yaml
images:
  - name: todo-app
    newTag: "4.8"
  - name: todo-backend
    newTag: "4.6"
configurations:
  - rollout-images.yaml
patches:
  - target:
      kind: Deployment
      name: todo-app-dep
    path: canary.yaml
