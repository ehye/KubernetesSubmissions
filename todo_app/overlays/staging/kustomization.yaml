apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../environments
replacements:
  - source: {kind: PersistentVolumeClaim, name: shared-data-pvc, fieldPath: metadata.namespace}
    targets:
      - select: {kind: AnalysisTemplate, name: restart-rate}
        fieldPaths: ['spec.args.[name=namespace].value']
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: broadcaster
        namespace: project
      spec:
        template:
          spec:
            containers:
              - name: broadcaster
                env:
                  - name: BROADCAST_MODE
                    value: log
                  - name: DISCORD_WEBHOOK_URL
                    $patch: delete
  - target:
      kind: Gateway
      name: todo-local
    patch: |-
      - op: replace
        path: /spec/listeners/0/port
        value: 18081
